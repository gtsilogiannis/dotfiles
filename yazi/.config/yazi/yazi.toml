# Yazi settings. Only the values that differ from the defaults; the theme is generated by matugen.

[mgr]
# Parent, current and preview columns: more room for the preview.
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"
show_symlink   = true
scrolloff      = 5

[preview]
wrap          = "no"
tab_size      = 4
# Sharper image previews in a full screen kitty window (run `ya cache clear` after changing).
max_width     = 1000
max_height    = 1000
image_filter  = "lanczos3"
image_quality = 80

[opener]
# Text files open in micro inside the same terminal.
edit = [
	{ run = "micro %s", block = true, desc = "micro", for = "unix" },
]
