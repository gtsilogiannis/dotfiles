# Only values that differ from the defaults; the theme comes from matugen

[mgr]
# More room for the preview column
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"
show_symlink   = true
scrolloff      = 5

[preview]
wrap          = "no"
tab_size      = 4
# Sharper previews in a full screen window; ya cache clear after a change
max_width     = 1000
max_height    = 1000
image_filter  = "lanczos3"
image_quality = 80

[opener]
# Edit text in micro, in the same terminal
edit = [
	{ run = "micro %s", block = true, desc = "micro", for = "unix" },
]
