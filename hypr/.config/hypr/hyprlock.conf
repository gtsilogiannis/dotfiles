# Colors come from matugen (generated, not tracked)
source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    path = ~/.cache/current_wallpaper.png
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    outer_color = $primary
    inner_color = $surface
    font_color = $on_surface
    fail_color = $error
    fade_on_empty = false
    placeholder_text = Password
    hide_input = false
    rounding = 12
    position = 0, -40
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $on_surface
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 110
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = $primary
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}
