background {
    monitor =
    path = ~/.cache/current_wallpaper.png
    blur_passes = 1
    blur_size = 4
}

input-field {
    monitor =
    size = 230, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(137, 180, 250, 0.8)
    inner_color = rgba(17, 17, 27, 0.85)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    placeholder_text = <span foreground="##585b70">Enter Password...</span>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(255, 255, 255)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 110
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(137, 180, 250)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}
