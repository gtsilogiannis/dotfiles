# Idle handling: dim the laptop panel, lock, then blank the screens.
# No automatic suspend: the laptop runs on the charger almost all the time.
# The Caffeine tile in the control center holds all of it off (Wayland idle inhibitor).

general {
    # The Quickshell lock screen; the script itself keeps it to one instance.
    lock_cmd = ~/.config/quickshell/scripts/lock.sh
    # Suspend waits until the lock screen covers every screen.
    inhibit_sleep = 3
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 5 min: dim the panel, restore it on activity.
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/idle-dim.sh dim
    on-resume = ~/.config/hypr/scripts/idle-dim.sh restore
}

# 10 min: lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: screens off, back on with any input.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
