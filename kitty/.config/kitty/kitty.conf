font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

background_opacity 0.88
confirm_os_window_close 0
window_padding_width 14
enable_audio_bell no

# Fixed ANSI palette (Catppuccin Mocha) for readable diffs, errors and syntax colors
color0 #45475A
color8 #585B70
color1 #F38BA8
color9 #F38BA8
color2  #A6E3A1
color10 #A6E3A1
color3  #F9E2AF
color11 #F9E2AF
color4  #89B4FA
color12 #89B4FA
color5  #F5C2E7
color13 #F5C2E7
color6  #94E2D5
color14 #94E2D5
color7  #BAC2DE
color15 #A6ADC8
shell zsh

# Surface colors (background, foreground, cursor, selection) come from matugen
include colors.conf
