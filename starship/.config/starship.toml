format = """
[┌─](bold #89b4fa)$directory$git_branch$git_status
[└─>](bold #89b4fa) """

[directory]
style = "bold #89b4fa"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold #f5c2e7"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #f38ba8"
format = "([$all_status$ahead_behind]($style) )"
