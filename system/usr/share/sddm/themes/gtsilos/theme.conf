[General]
; Defaults. /usr/local/bin/sddm-set-background writes theme.conf.user next to
; this file (background, font, side, blur, matugen colors) and its keys win.
; An empty Background leaves the surface color.
Background=
Font=IBM Plex Sans
FormPosition=right
Blur=1.0
BlurMax=32
RoundCorners=24
PrimaryColor=#b3c5ff
OnPrimaryColor=#002b75
SurfaceColor=#10131c
OnSurfaceColor=#e0e2ef
OnSurfaceVariantColor=#c4c6d3
FieldColor=#272a34
ErrorColor=#ffb4ab
AccentColor=#d0bdf6
