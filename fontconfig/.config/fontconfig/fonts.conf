<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Subpixel AA: horizontal text resolution up to 3x on the 94 PPI AOC -->
  <match target="font">
    <!-- Physical subpixel order of the panel; switch to bgr or none if colour fringes appear -->
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <!-- Spreads energy to neighbour subpixels to limit colour fringes -->
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <!-- Same as the current system default, stated explicitly -->
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
