# Generated by matugen. Do not edit: changes are overwritten.
# Two-line prompt in the theme colors: monochrome in focus mode, from the wallpaper in browsing.
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'matugen'

format = """
[┌─ ](bold frame)$directory$git_branch$git_status
$character"""
right_format = '$python$cmd_duration$status'

[palettes.matugen]
frame = '{{colors.primary.default.hex}}'
dir = '{{colors.primary.default.hex}}'
branch = '{{colors.tertiary.default.hex}}'
gitstat = '{{colors.secondary.default.hex}}'
venv = '{{colors.secondary.default.hex}}'
muted = '{{colors.outline.default.hex}}'
err = '{{colors.error.default.hex}}'

[character]
success_symbol = '[└─>](bold frame)'
error_symbol = '[└─>](bold err)'

[directory]
style = 'bold dir'
format = '[ $path]($style)[$read_only]($read_only_style) '
read_only = ' 󰌾'
read_only_style = 'err'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[git_branch]
symbol = ' '
style = 'bold branch'
format = '[$symbol$branch]($style) '

[git_status]
style = 'bold gitstat'
format = '([$ahead_behind$all_status]($style) )'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇡${ahead_count}⇣${behind_count}'
conflicted = '=${count}'
stashed = '≡${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'
untracked = '?${count}'

# Only shown while a virtual environment is active (no detection by files).
[python]
detect_extensions = []
detect_files = []
detect_folders = []
style = 'venv'
format = '[\($virtualenv\)]($style) '

[cmd_duration]
min_time = 2000
style = 'muted'
format = '[ $duration]($style) '

[status]
disabled = false
style = 'err'
format = '[✘ $status]($style) '
