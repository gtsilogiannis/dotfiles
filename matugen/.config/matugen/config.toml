# Color files for every themed app; the outputs are generated, not tracked

[config]

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/colors.conf'

[templates.starship]
input_path = '~/.config/matugen/templates/starship.toml'
output_path = '~/.config/starship.toml'

[templates.zsh]
input_path = '~/.config/matugen/templates/zsh.zsh'
output_path = '~/.config/zsh/colors.zsh'

[templates.zed]
input_path = '~/.config/matugen/templates/zed.json'
# No post_hook: Zed reloads the theme when the file changes
output_path = '~/.config/zed/themes/gtsilos.json'

[templates.yazi]
input_path = '~/.config/matugen/templates/yazi.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell.json'
output_path = '~/.config/quickshell/colors.json'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-4.0/colors.css'
# Firefox and GTK4 follow color-scheme, GTK3 the theme name
post_hook = 'gsettings set org.gnome.desktop.interface color-scheme prefer-{{mode}}; if [ {{mode}} = dark ]; then gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark; else gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3; fi'
